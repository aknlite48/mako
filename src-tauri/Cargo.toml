[package]
name = "mako"
version = "0.1.0"
description = "A low-memory code editor with Git Graph built in"
license = "MIT"
repository = "https://github.com/aknlite48/mako"
edition = "2021"

[lib]
name = "mako_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde_json = "1"
portable-pty = "0.8"
