name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc, tests, bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Bundle
        run: npm run build

  rust:
    name: Rust (fmt, clippy, check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! requires the frontendDist dir (../dist) to
      # exist at compile time; a stub is enough for clippy/check.
      - name: Stub frontend dist
        run: mkdir -p dist && touch dist/index.html
      - name: Format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
